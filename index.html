<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Santa 2026</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #333; color: white; padding: 20px; }
        .card { background: rgba(255, 255, 255, 0.1); padding: 20px; border-radius: 10px; max-width: 400px; margin: auto; }
        select, input, button { width: 90%; margin: 10px 0; padding: 10px; border-radius: 5px; border: none; font-size: 16px; }
        button { background: #25D366; color: white; cursor: pointer; font-weight: bold; }
        button:disabled { background: #555; cursor: not-allowed; }
        .hidden { display: none; }
        .success { color: #25D366; font-weight: bold; }
    </style>
</head>
<body>

    <div class="card">
        <h2>🎅 Secret Santa 2026 🎁</h2>
        
        <select id="participanteSelect">
            <option value="">Selecciona tu nombre</option>
            <option value="Miguel">Miguel</option>
            <option value="Familiar2">Familiar 2</option>
            <!-- Agrega el resto de los 8 familiares aquí -->
        </select>

        <button id="btnSolicitar" onclick="gestionarPIN()">📱 Solicitar PIN</button>
        <button id="btnReenviar" class="hidden" onclick="gestionarPIN()">Reenviar código</button>
        
        <p id="msjEstado" class="hidden"></p>

        <div id="zonaValidacion" class="hidden">
            <p>Ingresa el PIN de 4 dígitos que llegó a tu WhatsApp</p>
            <input type="text" id="inputPIN" placeholder="PIN secreto" maxlength="4">
            <button onclick="validarPIN()">🔓 Validar</button>
        </div>

        <div id="zonaRegalo" class="hidden">
            <p>¡Identidad confirmada!</p>
            <!-- Aquí va tu código de Firebase para guardar el regalo o hacer el sorteo -->
        </div>
    </div>

    <script>
        // 1. CREDENCIALES DE META
        const token = "EAAMP3ZBbZqvMBS8E0XUHYNC3T54rtP8NEZBlEdsnnqcOPymb4jcUhHhufWm4ZC0gZA5isffX60CxYLYUnrM2lGnRyZCbDqyLxcf1GAiOSXXTJ9krCxv9MiA";
        const phoneId = "1361285673738664";

        // 2. NÚMEROS DE TELÉFONO (Agrega el indicativo 57)
        const telefonos = {
            "Miguel": "+573235058575",
            "Familiar2": "+570000000000" // Cambiar por los reales cuando uses el número virtual
        };

        // 3. VARIABLES DE CONTROL DE TIEMPO
        let pinActual = null;
        let tiempoPrimerEnvio = 0;
        let tiempoUltimoEnvio = 0;
        let usuarioActual = "";

        // 4. FUNCIÓN PARA ENVIAR WHATSAPP (API META)
        async function enviarWhatsApp(telefono, mensaje) {
            const numero = telefono.replace("+", ""); 
            const url = `https://graph.facebook.com/v25.0/${phoneId}/messages`;

            try {
                await fetch(url, {
                    method: "POST",
                    headers: { 
                        "Authorization": `Bearer ${token}`, 
                        "Content-Type": "application/json" 
                    },
                    body: JSON.stringify({ 
                        messaging_product: "whatsapp", 
                        recipient_type: "individual", 
                        to: numero, 
                        type: "text", 
                        text: { body: mensaje } 
                    })
                });
            } catch (error) {
                console.error("Error al enviar WhatsApp:", error);
            }
        }

        // 5. LÓGICA DE CREACIÓN, TIEMPOS Y ENVÍO DEL PIN
        async function gestionarPIN() {
            const select = document.getElementById("participanteSelect");
            usuarioActual = select.value;
            
            if (!usuarioActual) {
                alert("Por favor, selecciona tu nombre de la lista.");
                return;
            }

            const telefono = telefonos[usuarioActual];
            const ahora = Date.now();
            const btnSolicitar = document.getElementById("btnSolicitar");
            const btnReenviar = document.getElementById("btnReenviar");
            const msjEstado = document.getElementById("msjEstado");

            // Si no hay PIN o pasaron 8 minutos desde la primera vez que se generó, crear uno nuevo
            if (!pinActual || (ahora - tiempoPrimerEnvio) >= 8 * 60 * 1000) {
                pinActual = Math.floor(1000 + Math.random() * 9000).toString();
                tiempoPrimerEnvio = ahora;
            }
            
            // Actualizar la hora del último envío (para expirar a los 5 mins)
            tiempoUltimoEnvio = ahora; 

            // Enviar el mensaje
            await enviarWhatsApp(telefono, `Hola ${usuarioActual}, tu PIN para el Secret Santa es: ${pinActual}`);

            // Actualizar interfaz
            msjEstado.innerText = "PIN enviado a tu WhatsApp ✅";
            msjEstado.classList.remove("hidden");
            msjEstado.classList.add("success");
            document.getElementById("zonaValidacion").classList.remove("hidden");

            // Bloquear botones e iniciar cooldown de 60 segundos
            btnSolicitar.classList.add("hidden");
            btnReenviar.classList.remove("hidden");
            btnReenviar.disabled = true;
            
            let cuentaRegresiva = 60;
            btnReenviar.innerText = `Espera ${cuentaRegresiva}s para reenviar`;
            
            const temporizador = setInterval(() => {
                cuentaRegresiva--;
                btnReenviar.innerText = `Espera ${cuentaRegresiva}s para reenviar`;
                
                if (cuentaRegresiva <= 0) {
                    clearInterval(temporizador);
                    btnReenviar.disabled = false;
                    btnReenviar.innerText = "Reenviar código";
                }
            }, 1000);
        }

        // 6. VALIDACIÓN DEL PIN Y EXPIRACIÓN
        function validarPIN() {
            const pinIngresado = document.getElementById("inputPIN").value;
            
            if (!pinActual) {
                alert("Primero debes solicitar el PIN.");
                return;
            }

            // Validar si pasaron más de 5 minutos desde que se envió
            if (Date.now() - tiempoUltimoEnvio > 5 * 60 * 1000) {
                alert("El PIN expiró (máximo 5 minutos de validez). Usa el botón de reenvío para recibirlo otra vez.");
                return;
            }

            if (pinIngresado === pinActual) {
                document.getElementById("zonaValidacion").classList.add("hidden");
                document.getElementById("msjEstado").classList.add("hidden");
                document.getElementById("btnReenviar").classList.add("hidden");
                document.getElementById("zonaRegalo").classList.remove("hidden");
                // Aquí ejecutas las funciones de Firebase para leer/escribir datos
            } else {
                alert("PIN incorrecto. Intenta nuevamente.");
            }
        }
    </script>
</body>
</html>
